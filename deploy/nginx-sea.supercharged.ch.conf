# sea.supercharged.ch -> web app on 127.0.0.1:7401, API on 127.0.0.1:7400
server {
    listen 443 ssl http2;
    server_name sea.supercharged.ch;

    ssl_certificate     /etc/letsencrypt/live/supercharged.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supercharged.ch/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://127.0.0.1:7400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:7400;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://127.0.0.1:7400;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:7400;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:7400;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:7401;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name sea.supercharged.ch;
    return 301 https://$host$request_uri;
}
