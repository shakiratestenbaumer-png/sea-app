name: swiss_energy_assistant
description: Swiss Energy Assistant — dynamic tariff intelligence for Swiss households.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  webview_flutter: ^4.10.0
  flutter_local_notifications: ^18.0.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  timezone: ^0.10.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
